<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K1 Arm</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>K1 Arm</h1>
    <span id="conn" class="badge off">disconnected</span>
    <span id="arm" class="badge off">no state</span>
    <button id="logout" class="link">Sign out</button>
  </header>

  <div id="agent-banner" class="banner" hidden>AI agent connected. STOP (Space / Esc) aborts its task.</div>

  <main>
    <section class="camera card">
      <img id="video" alt="wrist camera">
      <p id="video-status" class="muted">waiting for camera…</p>
    </section>

    <section class="controls card">
      <div class="row">
        <button id="enable" class="primary">Enable motors</button>
        <button id="stop" class="danger" title="Hold the current position (Space or Esc)">STOP</button>
      </div>

      <h2>Joints <span class="muted">(rad · measured)</span></h2>
      <div id="joints"></div>

      <h2>Gripper <span class="muted">(0 closed … 1 open)</span></h2>
      <div class="joint">
        <label for="gripper">gripper</label>
        <input id="gripper" type="range" min="0" max="1" step="0.01" value="1">
        <output id="gripper-value">–</output>
      </div>

      <h2>Poses</h2>
      <div id="poses" class="row wrap"></div>
      <button id="save-pose">Save current pose…</button>

      <p id="message" class="muted"></p>
    </section>

    <section class="log card">
      <h2>Agent <span id="agent-status" class="muted">· no agent service (start <code>k1-agent serve</code> on the PC)</span></h2>

      <div id="agent-question" class="question" hidden>
        <p id="agent-question-text"></p>
        <form id="agent-answer-form" class="row">
          <input id="agent-answer" type="text" autocomplete="off" placeholder="Your answer">
          <button type="submit" class="primary">Answer</button>
        </form>
        <div id="agent-confirm" class="row" hidden>
          <button id="agent-yes" class="primary">Yes</button>
          <button id="agent-no">No</button>
        </div>
        <div id="agent-reset" class="row" hidden>
          <button id="agent-ready" class="primary">Done, scene is reset</button>
        </div>
      </div>

      <form id="prompt-form" class="prompt">
        <textarea id="prompt" rows="2" maxlength="2000" placeholder="Tell the agent what to do, e.g. &quot;point the camera at the red cup&quot;" disabled></textarea>
        <div class="row">
          <select id="prompt-mode" title="tools: one step at a time, sees every frame · code: writes a program">
            <option value="tools">tools</option>
            <option value="code">code</option>
          </select>
          <button id="prompt-send" type="submit" class="primary" disabled>Send to agent</button>
        </div>
      </form>

      <h2>Agent log</h2>
      <ol id="agent-log" class="muted"><li>no agent messages yet</li></ol>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
