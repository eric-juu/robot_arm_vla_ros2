# The ROS-free test suites: k1_web's server and safety logic, the SDK, and the agent (with the simulated arm).
# No ROS, no arm, no API keys. The ROS-only tests (k1_examples, launch files) run on the arm PC with colcon test.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "agent[all,test]" -e "ros2/unitree_k1_sdk[standalone]"
      - name: k1_web
        working-directory: ros2/k1_web
        run: python -m pytest test -q
      - name: unitree_k1_sdk
        working-directory: ros2/unitree_k1_sdk
        run: python -m pytest test -q
      - name: agent
        working-directory: agent
        run: python -m pytest tests -q
