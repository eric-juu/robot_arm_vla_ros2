# API prices in US$ per million tokens, used to turn the token counts in traces into cost.
# Check them against the providers' pricing pages before a big evaluation, and update `checked`.
#
#   input        uncached input tokens          cache_read   cached input tokens
#   output       output tokens (incl. thinking) cache_write  tokens written to the prompt cache
#   long_context higher rates once one request's prompt is longer than `above` tokens
#   changes      rates that start on a date (for example when an introductory price ends)
#
# A model the API reports with a date suffix (gpt-5.5-2026-04-23) matches its row by prefix.
# Models missing here get cost: null in results; add a row to price them.

checked: 2026-10-26

models:
  # Anthropic: platform.claude.com/docs/en/about-claude/pricing (rates as of 2026-10-06).
  # cache_write is the 5-minute cache (1.25x input).
  claude-fable-5-1: {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5:     # cache_read assumed 0.1x input; prompts over 100K tokens cost more
    {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125,
     long_context: {above: 100000, input: 0.50, output: 2.50}}

  # OpenAI: openai.com/api/pricing. Confirm there; these come from third-party summaries.
  gpt-5.5:
    {input: 5.00, output: 30.00, cache_read: 0.50, cache_write: 0.0,
     long_context: {above: 272000, input: 10.00, output: 45.00}}
  # gpt-6-astra: {input: 10.00, output: 50.00, cache_read: 1.00, cache_write: 0.0}   # unconfirmed; fill in with the real id

  # Google: ai.google.dev/gemini-api/docs/pricing. Introductory Argon price ends 2026-11-30.
  gemini-4-argon:
    {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 0.0,
     changes: [{from: 2026-12-01, input: 4.00, output: 20.00, cache_read: 0.20}]}
  # Add the current Flash model with its id, e.g. {input: 0.75, output: 3.75, ...}
