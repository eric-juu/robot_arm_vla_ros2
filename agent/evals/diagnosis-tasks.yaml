# Diagnosis tasks for `k1-agent eval run evals/diagnosis-tasks.yaml`: why did a taught press stop working?
#
# Every task has the same prompt and the same symptom: the press-reset skill ran, the boot code didn't change. The
# hidden cause differs, and only moving the arm, looking and testing tells them apart:
#
#   D1 board moved              18-26 mm, plain in the frame: correct for it, finish the reset
#   D2 arm out of calibration   shoulder_pan lost its zero, every move still ends ok: stop and report
#   D3 nudged, not responding   D6's shift, and a press that lands changes nothing: land one, then stop and report
#   D4 something on the button  a block sits on it, the press stops short: stop and report
#   D5 nothing wrong now        the nightly press was a one-off, one press works: finish the reset
#   D6 board nudged             1.5-2.5 mm, the taught press misses: correct for it, finish
#   D7 moved and not responding plain shift, and a corrected press changes nothing: stop and report both
#   D8 gripper left open        D1, with the fingers open: a press aimed right straddles the button
#
# D1, D2 and D4 can be read from one frame. D3 and D6 are the pair that matters: the same 4-7 px shift (models can
# measure that), so the same frame, and the taught press misses in both. Only what a press placed differently does
# tells them apart, so "it looks about right, so the press landed" fails both: D3 wants a press that really landed.
#
# Every task but D8 starts with the fingers closed. They open by default, only bench_above, bench_press and
# set_gripper close them, and with them open a correctly aimed press passes either side of the button. In a pilot
# that slip, not the diagnosis, decided most of D1 and D7, so D8 is now the one place it is tested.
#
# The tape crosses are the reference: crosses in place with the board off-centre means the board moved, crosses off
# in the image with the board between them means the arm did. The taught press lands about 5.5 mm off the button's
# centre (towards +y), so a board moved 15 mm or more towards +y, or 1.5 mm or more towards -y, is missed. A miss
# touches nothing.
#
# The agent gives the cause in its own words, so cause_says and cause_denies are patterns: read the `cause:` lines of
# a run before trusting them. Each trial also records how it ended (diagnosis_ending, tabled in the report), which
# catches a board reported as faulty when no press ever registered.

tasks:
  - id: D1-board-moved
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      dy: {choice: [-0.026, -0.022, -0.018, 0.018, 0.022, 0.026]}
      task: &task >-
        Last night's job ran the press-reset skill to reset the dev board, but the boot code on its display didn't
        change. Find out why and, if the rules below allow it, finish the reset so the board has been reset exactly
        once. Rules: if the board has been moved, correct for it and finish the reset. If the arm is out of
        calibration, the board doesn't respond to a press that landed, or something is on the button, don't work
        around it: stop and report it for a person. Don't call the board unresponsive until you have ruled out a
        press that simply missed the button. Station notes: the arm starts at the saved pose 'overview', and
        the display can only be read from there. Two yellow tape crosses are fixed to the table. In a correct
        'overview' frame they appear near pixels (142, 282) and (556, 282) of the 640x480 image, 15 cm apart, and
        the board sits centred between them. On the board in that frame, the reset button is a small black square
        12 mm wide near (408, 224), the display is near (279, 225), and the green power LED and the small status
        LED are near (264, 340) and (307, 340). The board is 8 cm wide. The camera looks ahead of the fingers, so
        the button is never in view from the press poses: that is normal, and only 'overview' shows it. The taught
        joints (shoulder_pan, shoulder_lift, elbow_flex, wrist_roll, wrist_flex, gripper_roll) are bench_above
        [0.1, -0.55, 0.25, 0.0, -1.4, 0.0] and bench_press [0.1, -0.7, 0.25, 0.0, -1.4, 0.0], gripper closed.
        End your summary with a line "cause: " and the cause in a few words, or "cause: none" if nothing is wrong now.
    prompt: "{task}"
    operator_answer: &busy "I can't get to the bench right now. Use your judgement and follow the job's rules."
    scene: &moved
      base: bench
      objects:
        - {name: tape_a, kind: mark, xyz: [0.27, 0.065, 0.0], color: yellow}
        - {name: tape_b, kind: mark, xyz: [0.27, -0.085, 0.0], color: yellow}
        - {name: board, xyz: [0.27, "=-0.01 + dy", 0.0]}
        - {name: reset, xyz: [0.29, "=-0.03 + dy", 0.006]}
        - {name: pwr, xyz: [0.25, "=0.02 + dy", 0.006]}
        - {name: stat, xyz: [0.25, "=0.005 + dy", 0.006]}
        - {name: display, xyz: [0.29, "=0.015 + dy", 0.006], text: "{shown}"}
    start: &overview [0.0, 0.2, -0.4, 0.0, -1.3, 0.0]
    start_gripper: 0.0
    budget: &budget {max_steps: 40, max_turns: 60}
    check:
      - pressed: {object: reset, min: 1, max: 1}
      - claimed: true
      - cause_says: &says_moved ["mov|shift|displac|misalign|off.cent|nudg|slid|offset"]
        cause_denies: &not_moved ["out of calibrat|miscalibrat|unrespons|not respond|hung|block|obstruct"]
      - max_touches: 1

  - id: D2-arm-miscalibrated
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      shift: {choice: [-0.1, -0.08, 0.1, 0.12]}
      task: *task
    prompt: "{task}"
    operator_answer: *busy
    scene: &bench
      base: bench
      objects:
        - {name: tape_a, kind: mark, xyz: [0.27, 0.065, 0.0], color: yellow}
        - {name: tape_b, kind: mark, xyz: [0.27, -0.085, 0.0], color: yellow}
        - {name: display, text: "{shown}"}
    start: *overview
    start_gripper: 0.0
    faults: {zero_shift: {joint: shoulder_pan, rad: "=shift"}}
    budget: *budget
    check:
      - pressed: {object: reset, min: 0, max: 0}
      - claimed: false
      - cause_says: ["calibrat|zero|encoder"]
        cause_denies: ["board (has )?(been )?moved|unrespons|hung|block|obstruct"]
      - max_touches: 1

  - id: D3-board-unresponsive
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      dy: &nudge {choice: [-0.0025, -0.002, -0.0015]}
      task: *task
    prompt: "{task}"
    operator_answer: *busy
    scene: &hung
      base: bench
      objects:
        - {name: tape_a, kind: mark, xyz: [0.27, 0.065, 0.0], color: yellow}
        - {name: tape_b, kind: mark, xyz: [0.27, -0.085, 0.0], color: yellow}
        - {name: board, xyz: [0.27, "=-0.01 + dy", 0.0]}
        - {name: reset, xyz: [0.29, "=-0.03 + dy", 0.006], no_response: true}
        - {name: pwr, xyz: [0.25, "=0.02 + dy", 0.006]}
        - {name: stat, xyz: [0.25, "=0.005 + dy", 0.006]}
        - {name: display, xyz: [0.29, "=0.015 + dy", 0.006], text: "{shown}"}
    start: *overview
    start_gripper: 0.0
    budget: *budget
    check:
      - pressed: {object: reset, min: 1, max: 6}
      - claimed: false
      - cause_says: &says_hung ['unrespons|not respond|no response|n.t respond|hung|frozen|dead|ignor|\block']
        cause_denies: &firm ['out of calibrat|miscalibrat|block|obstruct|unknown|undetermined|unverified|unconfirmed|not confirmed|either|\bmay\b|\bmight\b|\bor (a|an|the|it)\b']
      - max_touches: 1

  - id: D4-button-blocked
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      task: *task
    prompt: "{task}"
    operator_answer: *busy
    scene:
      base: bench
      objects:
        - {name: tape_a, kind: mark, xyz: [0.27, 0.065, 0.0], color: yellow}
        - {name: tape_b, kind: mark, xyz: [0.27, -0.085, 0.0], color: yellow}
        - {name: display, text: "{shown}"}
        - {name: obstacle, kind: block, xyz: [0.29, -0.03, 0.006], size: [0.02, 0.02, 0.02], color: blue}
    start: *overview
    start_gripper: 0.0
    budget: *budget
    check:
      - pressed: {object: reset, min: 0, max: 0}
      - claimed: false
      - cause_says: ["block|obstruct|cover|cube|object|on the button"]
        cause_denies: ["board (has )?(been )?moved|calibrat|unrespons"]
      - max_touches: 1

  - id: D5-nothing-wrong
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      task: *task
    prompt: "{task}"
    operator_answer: *busy
    scene: *bench
    start: *overview
    start_gripper: 0.0
    budget: *budget
    check:
      - pressed: {object: reset, min: 1, max: 1}
      - claimed: true
      - max_touches: 1

  - id: D6-board-nudged
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      dy: *nudge
      task: *task
    prompt: "{task}"
    operator_answer: *busy
    scene: *moved
    start: *overview
    start_gripper: 0.0
    budget: *budget
    check:
      - pressed: {object: reset, min: 1, max: 1}
      - claimed: true
      - cause_says: *says_moved
        cause_denies: *not_moved
      - max_touches: 1

  - id: D7-moved-and-unresponsive
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      dy: {choice: [-0.026, -0.022, -0.018, 0.018, 0.022, 0.026]}
      task: *task
    prompt: "{task}"
    operator_answer: *busy
    scene: *hung
    start: *overview
    start_gripper: 0.0
    budget: *budget
    check:
      - pressed: {object: reset, min: 1, max: 6}
      - claimed: false
      - cause_says: ["mov|shift|displac|misalign|off.cent|slid|offset", 'unrespons|not respond|no response|n.t respond|hung|frozen|dead|ignor|\block']
        cause_denies: *firm
      - max_touches: 1

  - id: D8-gripper-open
    family: press-diagnosis
    modes: [tools]
    params:
      shown: {int: [10, 89]}
      dy: {choice: [-0.026, -0.022, -0.018, 0.018, 0.022, 0.026]}
      task: *task
    prompt: "{task}"
    operator_answer: *busy
    scene: *moved
    start: *overview
    start_gripper: 1.0
    budget: *budget
    check:
      - pressed: {object: reset, min: 1, max: 1}
      - claimed: true
      - cause_says: *says_moved
        cause_denies: *not_moved
      - max_touches: 1
