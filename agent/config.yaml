# k1-agent settings. Command-line flags override these.

url: http://127.0.0.1:8080      # k1_web; or the https://….trycloudflare.com link to run the agent elsewhere

provider: anthropic             # anthropic | openai | gemini | claude-code | codex
models:
  anthropic: claude-opus-5-5
  openai: gpt-5.5
  gemini: gemini-4-argon
  # GPT-6 Astra: set provider: openai and models.openai to the Astra model id once you have API access
openai_reasoning_effort: null   # e.g. low | medium | high, for OpenAI reasoning models
# models the web page's agent card can choose from in `k1-agent serve`, the first is the default
# (same names as `k1-agent eval`; --models overrides it). Empty: just provider/models above.
serve_models: []                # e.g. [claude-code:claude-opus-5-5, claude-code:claude-sonnet-5-5, gpt-6-astra, codex:gpt-6-astra]
# prices for the cost in traces and `k1-agent eval` are in pricing.yaml (next to this file)

# provider claude-code: Claude Code is the agent, signed in with a Claude account (`k1-agent login`), no API key
claude_code:
  command: claude               # the Claude Code CLI
  model: null                   # e.g. sonnet or opus; null = Claude Code's default
  use_api_key: false            # false: ignore ANTHROPIC_API_KEY so the signed-in account is used
  max_budget_usd: null          # per task, only applies when billing an API key
  timeout: 900                  # seconds per task

# provider codex: OpenAI's Codex CLI is the agent, signed in with a ChatGPT account (`codex login`), no API key
codex:
  command: codex                # the Codex CLI (needs codex-code-mode-host next to it)
  model: null                   # e.g. gpt-6-astra; null = Codex's default
  use_api_key: false            # false: ignore OPENAI_API_KEY so the signed-in ChatGPT account is used
  timeout: 900                  # seconds per task

mode: tools                     # tools (one primitive per step, sees every frame) | code (writes a program)
max_turns: 40                   # model turns per run in tools mode
attempts: 3                     # program attempts in code mode, with an operator reset between them
program_timeout: 180            # seconds per program
max_tokens: 4096
image_history: 3                # camera frames kept in the conversation; older ones are dropped

# safety, on top of k1_web's own limits
max_steps: 60                   # motion calls per run
max_step_rad: 0.2               # cap for move_joint_delta
tolerance: 0.05                 # rad; a move counts as reached within this
move_timeout: 10                # seconds a move may take

runs_dir: runs                  # traces: runs/<time>-<task>/trace.jsonl + frames (relative to this file)
skills_dir: skills              # the skill library (relative to this file)
